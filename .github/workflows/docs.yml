jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      ...
      - name: Deploy
        if: github.event_name == 'push' && github.repository == 'AMReX-FHD/FHDeX' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: Docs/sphinx_documentation/build/html
          target-folder: docs_html
          clean: false
